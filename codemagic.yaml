# Codemagic CI/CD 設定 — ラキカラ
#
# 事前準備は docs/STEP0_SETUP.md を参照。
# 「TODO:」が付いた箇所は Codemagic / App Store Connect 側の設定名に置き換えること。

definitions:
  flutter_env: &flutter_env
    # SDK は固定する。上げるときは意図的に上げる（CI だけ勝手に新しくならないように）
    flutter: 3.47.0
    xcode: latest
    cocoapods: default

workflows:
  ios-testflight:
    name: iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # TODO: Codemagic の Teams > Integrations > App Store Connect で登録したキー名に置き換える
      app_store_connect: RAKIKARA_ASC_KEY
    environment:
      <<: *flutter_env
      groups:
        # 本番用のIDを入れる環境変数グループ（Step 9）。
        #   RAKUTEN_AFFILIATE_ID
        #   ADMOB_USE_PRODUCTION_IDS
        #   ADMOB_BANNER_UNIT_ID_IOS / ADMOB_NATIVE_UNIT_ID_IOS
        #   ADMOB_BANNER_UNIT_ID_ANDROID / ADMOB_NATIVE_UNIT_ID_ANDROID
        #   PRIVACY_POLICY_URL
        #
        # **Codemagic 側にこの名前のグループを作ってから、下の行を有効にすること。**
        # 存在しないグループを参照するとビルドが始まらない。
        # 有効にするまでは、アプリ側がテストIDや既定URLにフォールバックする。
        # - rakikara_release
        # CERTIFICATE_PRIVATE_KEY を入れた環境変数グループ。
        # 配布証明書の秘密鍵。これが無いと証明書を保存できず、
        # "Cannot save Signing Certificates without certificate private key" で
        # 署名ファイルが1つも用意されないまま先に進んでしまう。
        # 作り方は docs/STEP0_SETUP.md を参照。
        - certificate_credentials
      vars:
        BUNDLE_ID: com.ichirou600.rakikara
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze
      - name: Flutter unit tests
        script: flutter test
      - name: Cloud Functions typecheck
        script: |
          cd functions
          npm ci
          npm run typecheck
      # Podfile はリポジトリに置かず Flutter に生成させる。
      # このステップを飛ばすと Podfile が無い状態で pod install が空振りする。
      - name: Prepare iOS project
        script: flutter build ios --config-only --release --no-codesign
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;
      # 署名は App Store Connect API キーから自動生成する。
      #
      # environment.ios_signing の distribution_type / bundle_identifier は
      # 「Codemagic に手動アップロード済みの署名ファイルから選ぶ」指定で、
      # 無いものを作ってはくれない。新規アカウントでは
      # "No matching profiles found for bundle identifier ..." で落ちる。
      # --create を明示して、証明書とプロファイルを作らせる。
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build ipa
        script: |
          # 本番IDは環境変数グループから差し込む。未設定なら空文字が渡り、
          # アプリ側がテストIDや既定URLにフォールバックする。
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=RAKUTEN_AFFILIATE_ID="$RAKUTEN_AFFILIATE_ID" \
            --dart-define=ADMOB_USE_PRODUCTION_IDS="${ADMOB_USE_PRODUCTION_IDS:-false}" \
            --dart-define=ADMOB_BANNER_UNIT_ID_IOS="$ADMOB_BANNER_UNIT_ID_IOS" \
            --dart-define=ADMOB_NATIVE_UNIT_ID_IOS="$ADMOB_NATIVE_UNIT_ID_IOS" \
            --dart-define=PRIVACY_POLICY_URL="${PRIVACY_POLICY_URL:-https://ichirou600-blip.github.io/body-color-diagnosis/privacy/}" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        # アップロードは常に行われる。内部テスト（自分の実機で試す用）は
        # ベータ審査が不要なので、この時点で TestFlight に出せる。
        #
        # submit_to_testflight: true は「外部テスト用のベータ審査に提出する」指定。
        # 外部テストには App Store Connect 側で Beta App Description（テスト情報）の
        # 入力が必須で、未入力だと 422 Beta App Description is missing で失敗する。
        # 外部テスターに配る段階（Step 9）で、説明文を入れてから true にする。
        submit_to_testflight: false
        # ストア審査への提出は Step 9。
        submit_to_app_store: false
      email:
        recipients:
          # TODO: 通知先メールアドレスを設定する
          - your-address@example.com
        notify:
          success: true
          failure: true

  android-build:
    name: Android - build check
    # 無料プランで使えるインスタンスは mac_mini_m2 のみ。
    # linux_x2 / linux_x4 / windows_x2 / mac_mini_m4 は課金を有効にしたアカウント専用で、
    # 指定すると "The selected instance type is not available with the current billing plan" で落ちる。
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      <<: *flutter_env
      groups:
        # iOS 側と同じグループ。**作成してから有効にすること。**
        # - rakikara_release
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze
      - name: Flutter unit tests
        script: flutter test
      - name: Cloud Functions typecheck
        script: |
          cd functions
          npm ci
          npm run typecheck
      # Step 0 は「ビルドが通ること」の確認のみ。
      # リリース署名（keystore）と Play への配信は Step 9 で追加する。
      - name: Build APK
        script: |
          # iOS と同じく、未設定なら空文字が渡ってテストIDにフォールバックする。
          flutter build apk --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=RAKUTEN_AFFILIATE_ID="$RAKUTEN_AFFILIATE_ID" \
            --dart-define=ADMOB_USE_PRODUCTION_IDS="${ADMOB_USE_PRODUCTION_IDS:-false}" \
            --dart-define=ADMOB_BANNER_UNIT_ID_ANDROID="$ADMOB_BANNER_UNIT_ID_ANDROID" \
            --dart-define=ADMOB_NATIVE_UNIT_ID_ANDROID="$ADMOB_NATIVE_UNIT_ID_ANDROID" \
            --dart-define=PRIVACY_POLICY_URL="${PRIVACY_POLICY_URL:-https://ichirou600-blip.github.io/body-color-diagnosis/privacy/}"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
